<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currículo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-root">

  <header class="masthead">
    <div class="wrap masthead-inner">
      <div id="masthead-photo-wrap"></div>
      <div class="masthead-text">
        <h1 class="masthead-name" id="masthead-name"></h1>
        <p class="masthead-role" id="masthead-role"></p>
        <ul class="contact-row" id="contact-row"></ul>
      </div>
      <button class="print-btn" id="print-btn" type="button">Exportar PDF</button>
    </div>
  </header>

  <div class="wrap layout">

    <aside class="sidebar">
      <section class="block">
        <span class="eyebrow">Perfil Pessoal</span>
        <p id="perfil-texto"></p>
      </section>

      <section class="block">
        <span class="eyebrow">Áreas de Conhecimento</span>
        <div id="areas-conhecimento"></div>
      </section>

      <section class="block">
        <span class="eyebrow">Formação Acadêmica</span>
        <ul class="list-plain" id="formacao-lista"></ul>
      </section>

      <section class="block">
        <span class="eyebrow">Idiomas</span>
        <ul class="list-plain" id="idiomas-lista"></ul>
      </section>
    </aside>

    <main class="content">
      <section class="block">
        <span class="eyebrow">Objetivo Profissional</span>
        <p id="objetivo-texto"></p>
      </section>

      <section class="block">
        <span class="eyebrow">Resumo de Qualificações</span>
        <div id="resumo-texto"></div>
      </section>

      <section class="block">
        <span class="eyebrow">Experiência Profissional</span>
        <ul class="timeline" id="timeline"></ul>
      </section>
    </main>

  </div>

  <footer class="page-footer">
    <div class="wrap">
      <p><span id="footer-nome"></span> · Currículo gerado a partir de dados estruturados · <span id="footer-ano"></span></p>
    </div>
  </footer>

</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
